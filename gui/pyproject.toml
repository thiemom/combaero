[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "combaero-gui"
dynamic = ["version"]
description = "CombAero Network GUI — React/FastAPI desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    { name = "thiemom", email = "2641939+thiemom@users.noreply.github.com" }
]
keywords = ["aerodynamics", "combustion", "aerothermal", "propulsion", "gui", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Floors clear every known advisory (OSV, checked 2026-10-25) and pass the
    # suite; the nightly dependency-floors job tests them. starlette and h11 are
    # transitive but pinned here: a floor only binds where it is declared, and
    # an install that already has an older one keeps it otherwise.
    "fastapi>=0.133.0",    # first release allowing starlette 1.x; CVE-2024-24762 fixed in 0.109.1
    "starlette>=1.3.1",    # CVE-2026-48710/48817/48818/54282/54283 (Host/path poisoning, StaticFiles SSRF, form limits)
    "uvicorn>=0.30.0",
    "h11>=0.16.0",         # CVE-2025-43859 (malformed chunked bodies)
    "pydantic>=2.7.0",     # fastapi 0.133's own floor; CVE-2024-3772 fixed in 2.4.0
    "pandas>=2.2.3",
    "combaero~=0.7",
]

[project.optional-dependencies]
gui = []

[project.urls]
Homepage = "https://github.com/thiemom/combaero"
Repository = "https://github.com/thiemom/combaero"
"Bug Tracker" = "https://github.com/thiemom/combaero/issues"
Changelog = "https://github.com/thiemom/combaero/blob/main/CHANGELOG.md"

[project.scripts]
combaero-gui = "gui.backend.main:run_server"

[tool.setuptools]
package-dir = {gui = "."}
packages = ["gui", "gui.backend"]

[tool.setuptools.package-data]
gui = [
    "frontend/dist/*",
    "frontend/dist/assets/*",
    "frontend/dist/**/*",
    # Worked examples from papers (#793), served by /examples.
    "examples/*.json",
]

[tool.setuptools_scm]
root = ".."
local_scheme = "no-local-version"

[tool.uv]
managed = true
package = true

[tool.uv.sources]
combaero = { workspace = true }
