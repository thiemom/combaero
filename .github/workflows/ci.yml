name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The backstop for a path filter that misses a dependency: every job runs
  # on a push to main, nightly and on demand -- only a pull request is
  # filtered.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Keyed on the event too: the nightly run must not cancel a push to main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.lint == 'true' }}
      pkg: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.pkg == 'true' }}
      cpp: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.cpp == 'true' }}
      gui: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.gui == 'true' }}
      workflows: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only a pull request is filtered; a push to main, the nightly run and
      # a manual dispatch run everything.
      - name: Full or filtered
        id: mode
        run: echo "full=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      # Each filter names what its job READS, so a change runs exactly the
      # jobs it can break. Pinned by SHA: this step decides which checks run.
      - name: Detect changed paths
        id: filter
        if: steps.mode.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            # check-source-style.sh scans src/include/examples/tests;
            # check-python-style.sh every .py. A superset of `cpp`, which
            # the native builds wait on.
            lint:
              - 'src/**'
              - 'include/**'
              - 'examples/**'
              - 'tests/**'
              - 'validation/**/*.h'
              - '**/*.py'
              - 'CMakeLists.txt'
              - 'ruff.toml'
              - 'pyproject.toml'
              - 'scripts/check-source-style.sh'
              - 'scripts/check-python-style.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/toolchain-mingw.cmake'
            # The importable package, what the MSVC extension build and its
            # import smoke test read. It is the only job that has caught a
            # dev-only dependency leaking into `import combaero` (sympy,
            # from a module-scope import), and such a leak can only come
            # from the package itself or its dependency pins.
            pkg:
              - 'python/combaero/**'
              - 'python/tests/test_import.py'
              - 'src/**'
              - 'include/**'
              - 'CMakeLists.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/ci.yml'
            # What the native C++ builds read: the 3-OS ctest matrix and
            # MinGW compile only these.
            cpp:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**/*.cpp'
              # Three C++ tests include golden-data headers from here.
              - 'validation/**/*.h'
              - 'CMakeLists.txt'
              - '.github/workflows/ci.yml'
              - '.github/workflows/toolchain-mingw.cmake'
            gui:
              - 'gui/**'
              - 'biome.json'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/check_version_sync.py'
            # Any workflow file: actionlint. A change to publish*.yml or
            # claude*.yml runs only that (it used to run every Python job).
            workflows:
              - '.github/workflows/**'

  # Repository-wide consistency, on every pull request whatever it touches:
  # a docs- or changelog-only change ran no check at all before.
  meta:
    name: Changelog, UNITS.md and version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Changelog fragments
        run: uv run --no-project scripts/changelog.py check

      - name: docs/UNITS.md is generated from include/units_data.h
        run: |
          uv run --no-project scripts/generate_units_md.py
          git diff --exit-code docs/UNITS.md

      - name: Pinned tool versions agree
        run: uv run --no-project scripts/check_version_sync.py

  actionlint:
    name: Lint workflows (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: actionlint
        run: uvx --from actionlint-py==1.7.7.23 actionlint

  lint:
    name: Lint & Style Checks
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check C++ source code style
        run: ./scripts/check-source-style.sh --verbose

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --no-install-workspace --all-extras --all-groups

      - name: Check Python code style
        run: uv run ./scripts/check-python-style.sh --verbose

  lint-gui:
    name: Lint & Style Checks (GUI)
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --no-install-workspace --all-extras --all-groups

      - name: Check Python style (GUI backend)
        run: uv run ruff check gui/ && uv run ruff format --check gui/

      - name: Check pinned tool versions agree
        run: uv run scripts/check_version_sync.py

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15

      - name: Check frontend style (Biome)
        run: biome check gui/frontend/src

  build-and-test:
    name: Build & Test C++ (${{ matrix.os }}, ${{ matrix.build_type }})
    needs: [changes, lint]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        build_type: [ Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv (Build dependencies)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install build dependencies
        run: uv sync --no-install-workspace --all-extras --all-groups

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure (Ninja on Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure (default generator)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests (ctest)
        working-directory: build
        run: |
          ctest --output-on-failure --parallel

      - name: Run accuracy tests
        working-directory: build
        if: runner.os != 'Windows'
        run: |
          ./test_ice_equation_accuracy
          ./test_water_equation_accuracy

  build-mingw:
    name: Build MinGW
    needs: [changes, lint]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MinGW
        run: |
          gcc --version
          g++ --version

      - name: Configure (CMake with MinGW)
        run: |
          cmake -G "MinGW Makefiles" -S . -B build-mingw `
            -DCMAKE_BUILD_TYPE=Release `
            -DCOMBAERO_ENABLE_TESTS=OFF

      - name: Build Windows binaries
        run: cmake --build build-mingw --config Release

  build-python-windows:
    name: Build Python Extension (Windows/MSVC)
    # Not gated on lint: this is the longest CI job (4-7 min), and waiting
    # for lint added 2 min to every PR's wall time. The status check still
    # requires both.
    needs: changes
    if: needs.changes.outputs.pkg == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Build Python extension (MSVC)
        run: uv pip install --system --no-deps -e .

      - name: Import smoke test (MSVC extension)
        run: |
          uv pip install --system pytest numpy scipy
          python -m pytest python/tests/test_import.py -q

  status-check:
    # IMPORTANT: Keep this literal name in sync with Iron ruleset required context:
    # "CI / status-check". Ruleset matching is strict and relies on exact string equality.
    name: CI / status-check
    # Every job must be listed here: the ruleset requires only this one, so a
    # job missing from `needs` is not enforced.
    needs: [changes, meta, actionlint, lint, lint-gui, build-and-test, build-mingw, build-python-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI outcomes
        shell: bash
        run: |
          fail=0
          # require <filter output> <job result> <name>: when the job's
          # filter fired it must have RUN and succeeded -- skipped is a pass
          # only when nothing it reads changed.
          require() {
            echo "$3: changed=$1 result=$2"
            if [[ "$1" == "true" && "$2" != "success" ]]; then
              echo "::error::$3 did not succeed ($2)"
              fail=1
            fi
          }
          require true "${{ needs.changes.result }}" "changes"
          require true "${{ needs.meta.result }}" "meta"
          require "${{ needs.changes.outputs.workflows }}" "${{ needs.actionlint.result }}" "actionlint"
          require "${{ needs.changes.outputs.lint }}" "${{ needs.lint.result }}" "lint"
          require "${{ needs.changes.outputs.gui }}" "${{ needs.lint-gui.result }}" "lint-gui"
          require "${{ needs.changes.outputs.cpp }}" "${{ needs.build-and-test.result }}" "build-and-test"
          require "${{ needs.changes.outputs.cpp }}" "${{ needs.build-mingw.result }}" "build-mingw"
          require "${{ needs.changes.outputs.pkg }}" "${{ needs.build-python-windows.result }}" "build-python-windows"
          exit $fail
