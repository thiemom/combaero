name: Validation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The backstop for a path filter that misses a dependency: every job runs
  # on a push to main, nightly and on demand -- only a pull request is
  # filtered.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Keyed on the event too: the nightly run must not cancel a push to main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.pkg == 'true' }}
      pytests: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.pytests == 'true' }}
      examples: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.examples == 'true' }}
      gui: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.gui == 'true' }}
      floors: ${{ steps.mode.outputs.full == 'true' || steps.filter.outputs.floors == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only a pull request is filtered; a push to main, the nightly run and
      # a manual dispatch run everything.
      - name: Full or filtered
        id: mode
        run: echo "full=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      # Each filter names what its job READS. Pinned by SHA: this step
      # decides which checks run.
      - name: Detect changed paths
        id: filter
        if: steps.mode.outputs.full != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            # The Cantera comparison: the package against Cantera. It reads
            # no validation/ data.
            pkg:
              - 'python/combaero/**'
              - 'src/**'
              - 'include/**'
              - 'cantera_validation_tests/**'
              - 'CMakeLists.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/validation-tests.yml'
            # The Python suite reads far beyond python/: the scored data and
            # runners in validation/ (PR #437 merged with 10 of 14 checks
            # skipped without it), docs/ and READMEs (API and record sync),
            # changelog.d/, the C++ test names (fidelity registry), the GUI
            # backend and frontend (test_gui_*, units sync), scripts/ and
            # thermo_data_generator/. So it runs on anything but a change
            # confined to other workflow or tool-config files.
            pytests:
              - 'python/**'
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'validation/**'
              - 'docs/**'
              - '**/*.md'
              - 'changelog.d/**'
              - 'gui/**'
              - 'scripts/**'
              - 'thermo_data_generator/**'
              - 'cantera_validation_tests/**'
              - 'CMakeLists.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'ruff.toml'
              - '.github/workflows/validation-tests.yml'
            # The examples run against the package; they also read
            # python/tests/data/ and import gui.backend.
            examples:
              - 'python/examples/**'
              - 'python/combaero/**'
              - 'python/tests/data/**'
              - 'gui/backend/**'
              - 'scripts/run_examples.py'
              - 'src/**'
              - 'include/**'
              - 'CMakeLists.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/validation-tests.yml'
            gui:
              - 'gui/**'
              - '.github/workflows/validation-tests.yml'
            # The declared dependency floors: a PR that moves one must pass at
            # the new floor, not only at the locked (newest) versions.
            floors:
              - 'pyproject.toml'
              - 'gui/pyproject.toml'
              - 'scripts/dependency_floors.py'
              - '.github/workflows/validation-tests.yml'

  cantera-validation:
    name: Test Cantera Validation
    needs: changes
    if: needs.changes.outputs.pkg == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.12' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: uv sync --all-extras --all-groups

      - name: Run combustion validation tests
        working-directory: cantera_validation_tests
        run: |
          uv run pytest test_combustion_validation.py -v --tb=short

      - name: Run equilibrium validation tests
        working-directory: cantera_validation_tests
        run: |
          uv run pytest test_equilibrium_validation.py -v --tb=short

      - name: Run transport validation tests
        working-directory: cantera_validation_tests
        run: |
          uv run pytest test_transport_validation.py -v --tb=short

      - name: Run mixing validation tests
        working-directory: cantera_validation_tests
        run: |
          uv run pytest test_mixing_validation.py -v --tb=short || true

      - name: Generate test report
        if: always()
        working-directory: cantera_validation_tests
        run: |
          uv run pytest --tb=no --no-header -q > test_summary.txt || true
          cat test_summary.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cantera_validation_tests/test_summary.txt

  python-unit-tests:
    # Two halves of one suite, run in parallel on separate runners: the
    # modules marked `slow` (over 20 s on one worker) and the rest. The
    # markers partition the suite exactly, both halves are required by the
    # status check, and both run on every PR -- nothing is skipped before a
    # merge. One job held them on 4 workers, where --dist loadscope keeps a
    # module on one worker, so the few heavy modules set its wall time.
    name: Test Python Unit (${{ matrix.tier }})
    needs: changes
    if: needs.changes.outputs.pytests == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ '3.12' ]
        tier: [ 'not slow', 'slow' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: uv sync --all-extras --all-groups

      - name: Run Python unit tests
        working-directory: python/tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest -m "${{ matrix.tier }}" -n auto --dist loadscope -q --tb=short --durations=25

  examples-smoke:
    name: Examples Smoke (run, not import)
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: uv sync --all-extras --all-groups

      # scripts/run_examples.py RUNS each example rather than importing it.
      # Importing is not enough: an example calling a removed function from
      # inside a function imports cleanly and only fails when the function
      # runs. Measured on four of the broken examples -- an import check
      # caught two.
      #
      # The runner owns the known-broken skip list and the headless plotting
      # env, so the same command reproduces this job locally.
      - name: Run every example
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: uv run scripts/run_examples.py

  dependency-floors:
    # Dependabot keeps uv.lock at the newest releases, so every other job
    # tests the TOP of each declared range. This one tests the bottom: every
    # runtime dependency of combaero and combaero-gui at its declared floor
    # (scripts/dependency_floors.py, installed with --resolution
    # lowest-direct; transitive dependencies resolve normally), then the fast
    # suite and the examples. A floor that no longer installs or passes is a
    # promise the packages cannot keep; raise it rather than skip it.
    name: Dependency Floors (lowest-direct)
    needs: changes
    if: needs.changes.outputs.floors == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies (locked)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"
        run: uv sync --all-extras --all-groups

      - name: Every runtime dependency declares a floor
        run: uv run --no-sync scripts/dependency_floors.py --check

      - name: Move the runtime dependencies down to their floors
        run: |
          uv run --no-sync scripts/dependency_floors.py > "$RUNNER_TEMP/floors.in"
          # Compile to exact pins first: `uv pip install --resolution
          # lowest-direct` keeps an already-satisfied newer version in place.
          uv pip compile --python-version 3.12 --resolution lowest-direct --no-header \
            "$RUNNER_TEMP/floors.in" -o "$RUNNER_TEMP/floors.txt"
          uv pip install -r "$RUNNER_TEMP/floors.txt"

      - name: Every runtime dependency is installed at its floor
        run: uv run --no-sync scripts/dependency_floors.py --verify

      # --no-sync throughout: a plain `uv run` would sync the lock back to the
      # newest versions and test those instead.
      - name: Run the fast Python suite at the floors
        working-directory: python/tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync pytest -m "not slow" -n auto --dist loadscope -q --tb=short

      - name: Run every example at the floors
        env:
          PYTHONPATH: ${{ github.workspace }}
          MPLBACKEND: Agg
        run: uv run --no-sync scripts/run_examples.py

  frontend-validation:
    name: Frontend Validation (Node 24 LTS)
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'gui/frontend/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install
        working-directory: gui/frontend
      - name: Run validation
        run: |
          pnpm run lint
          pnpm run test
          pnpm run build
        working-directory: gui/frontend

  status-check:
    # IMPORTANT: Keep this literal name in sync with Iron ruleset required context:
    # "Validation Tests / status-check". Ruleset matching is strict and relies on exact string equality.
    name: Validation Tests / status-check
    # Every job must be listed here: the ruleset requires only this one, so a
    # job missing from `needs` is not enforced.
    needs: [changes, cantera-validation, python-unit-tests, examples-smoke, dependency-floors, frontend-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate validation workflow outcomes
        shell: bash
        run: |
          fail=0
          # require <filter output> <job result> <name>: when the job's
          # filter fired it must have RUN and succeeded. Skipped used to pass
          # even then, which would have let a misfired filter merge untested
          # code.
          require() {
            echo "$3: changed=$1 result=$2"
            if [[ "$1" == "true" && "$2" != "success" ]]; then
              echo "::error::$3 did not succeed ($2)"
              fail=1
            fi
          }
          require true "${{ needs.changes.result }}" "changes"
          require "${{ needs.changes.outputs.pkg }}" "${{ needs.cantera-validation.result }}" "cantera-validation"
          require "${{ needs.changes.outputs.pytests }}" "${{ needs.python-unit-tests.result }}" "python-unit-tests"
          require "${{ needs.changes.outputs.examples }}" "${{ needs.examples-smoke.result }}" "examples-smoke"
          require "${{ needs.changes.outputs.gui }}" "${{ needs.frontend-validation.result }}" "frontend-validation"
          require "${{ needs.changes.outputs.floors }}" "${{ needs.dependency-floors.result }}" "dependency-floors"
          exit $fail
