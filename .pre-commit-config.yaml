repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: changelog-fragments
        name: Changelog fragments (changelog.d/)
        entry: uv run scripts/changelog.py check
        language: system
        pass_filenames: false
        files: ^changelog\.d/
        stages: [pre-commit]

      - id: version-sync
        name: Pinned tool versions agree (biome)
        entry: uv run scripts/check_version_sync.py
        language: system
        pass_filenames: false
        files: ^(gui/frontend/package\.json|biome\.json|\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|scripts/check_version_sync\.py)$
        stages: [pre-commit]

      - id: python-style-check
        name: Python style checks (ruff + ruff format + optional mypy)
        entry: bash -c './scripts/check-python-style.sh'
        language: system
        pass_filenames: false
        files: ^(python/|cantera_validation_tests/|thermo_data_generator/)
        stages: [pre-commit]

      - id: cantera-validation-tests
        name: Cantera Validation Tests
        entry: bash -c 'CANTERA_DATA="$PWD/cantera_validation_tests" uv run --project cantera_validation_tests pytest cantera_validation_tests -v --tb=short'
        language: system
        pass_filenames: false
        always_run: false
        files: ^(src/|include/|python/|cantera_validation_tests/)
        stages: [pre-commit]

      - id: python-unit-tests
        name: Python Unit Tests
        entry: bash -c 'uv run pytest python/tests/ -n auto --dist loadscope -q'
        language: system
        pass_filenames: false
        always_run: false
        files: ^(src/|include/|python/)
        stages: [pre-commit]

      - id: thermo-header-check
        name: Thermo/Transport Header (generated file check)
        entry: bash -c './scripts/check-thermo-header.sh'
        language: system
        pass_filenames: false
        files: ^(thermo_data_generator/|include/thermo_transport_data\.h)
        stages: [pre-commit]

      - id: common-names-check
        name: Common names completeness check
        entry: bash -c './scripts/check-common-names.sh'
        language: system
        pass_filenames: false
        files: ^include/(thermo_transport_data|common_names)\.h$
        stages: [pre-commit]

      - id: math-constants-check
        name: Math constants portability check (MSVC compatibility)
        entry: .pre-commit-hooks/check_math_constants.py
        language: system
        files: \.(cpp|h|hpp|cc|cxx)$
        stages: [pre-commit]

      - id: ascii-only
        name: ASCII-only C++ and Python sources (#791)
        entry: uv run scripts/check_ascii.py
        language: system
        files: \.(py|h|hpp|cpp|cc)$
        # TEMPORARY: the files that held non-ASCII when the hook landed,
        # generated by `scripts/check_ascii.py --all` (sorted). New files are
        # checked; this list shrinks to nothing in the #791 sweep PR, and
        # then the exclude goes away.
        exclude: |
          (?x)^(
          \.pre-commit-hooks/check_math_constants\.py|
          benchmarks/compare_jacobian_baseline\.py|
          benchmarks/function_profiling\.py|
          benchmarks/mach_sweep\.py|
          cantera_validation_tests/analyze_viscosity\.py|
          cantera_validation_tests/test_combustion_validation\.py|
          cantera_validation_tests/test_equilibrium_validation\.py|
          cantera_validation_tests/test_nasa9_polynomials\.py|
          examples/acoustics_example\.cpp|
          examples/combustion_example\.cpp|
          examples/combustion_state_example\.cpp|
          examples/compressible_example\.cpp|
          examples/humidair_example\.cpp|
          examples/incompressible_example\.cpp|
          examples/orifice_example\.cpp|
          examples/thermo_example\.cpp|
          gui/backend/graph_builder\.py|
          gui/backend/runner\.py|
          include/acoustics\.h|
