# Figure card: Han, Dutta & Ekkad (2012) Figure 4.51, p. 383, LOWER panel.
# After Han, J.C. et al. (1991), ASME JHT 113, 590.
#
# Nine rib configurations against the 90 deg Han (1988) reference line.
item: "Figure 4.51 lower panel, scatter"
series: "measured points, one rib configuration"
x_axis: e_plus
y_axis: G_bar
kind: measured
uncertainty: 0.06

verification:
  x_axis_type: log
  y_axis_type: log
  # Abscissa prints as `e+ x 10^-2`, ticks 1 2 4 6 10 -> e+ = 100..1000.
  # The SECOND figure to carry this multiplier, after 4.54. A digitiser
  # calibrated on the tick labels alone drops it and lands two decades
  # out, which is why x_multiplier is recorded rather than folded in.
  x_ticks: [1, 2, 4, 6, 10]
  x_multiplier: 1.0e2
  y_ticks: [10, 20, 30, 40]
  printed_curve: null
  monotonic: null
  expected_points: null
  plot_x_limits: [100, 1400]
  plot_y_limits: [10, 42]

# Panel distortion, measured on this figure's own frames:
#   x-axis frame slope  +0.00327
#   y-axis frame slope  -0.00885   (verticality; only a VERTICAL frame
#                                   sees a shear, and this figure has one)
# Figure 4.46's panels measured +0.00078 and -0.00036, so 4.51 is roughly
# 4x more distorted. Picks here carry a correspondingly wider honest
# tolerance.
