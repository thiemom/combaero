# Figure card: Figure 4.46 panel FRAMES, both panels.
#
# Not data. A plot frame is horizontal by construction, so its fitted slope
# is the panel's distortion and nothing else -- a yardstick that does not
# assume the draftsman drew any equation faithfully. Pick a frame before
# trusting anything else off a figure.
item: "Figure 4.46 panel frames"
series: "bottom frame line, measured for distortion"
x_axis: e_plus
y_axis: frame_position
kind: frame

verification:
  kind: frame
  x_ticks: [50, 100, 200, 300, 500, 1000]
  x_multiplier: 1.0
  # A frame sits just outside the labelled ticks, so no y bound is asserted.
  y_ticks: []
  # 0.002 admits the 0.2-0.4% wobble of honest picking over a 1.5-decade
  # abscissa while rejecting a real tilt. Measured: upper +0.00078,
  # lower -0.00036, against the R line's +0.00857.
  frame_tolerance: 0.002
  monotonic: null
  expected_points: null
