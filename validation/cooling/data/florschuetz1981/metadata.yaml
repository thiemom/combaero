# Calibration files (rc_XX_corners.csv, rc_XX_xaxis.csv, rc_XX_yaxis.csv)
# are committed alongside the measured series below but deliberately NOT
# listed here: they are single-digit point clouds hugging the plot
# origin, and verify.py's frame-slope check (a log-log power-law fit,
# built for a physically-drawn distortion line spanning a real data
# range) throws a math domain error on coordinates this close to zero --
# checked directly, not assumed (log(0) from an exact x=0 tick click).
# Their calibration quality was measured once, off the harness, instead:
# every panel's five x-ticks (0/0.2/0.4/0.6/0.8) land within 0.32%
# of round numbers, every panel's four y-ticks (0.4/0.6/0.8/1.0) land within
# 0.97%, and all four corners land within 3.4% of the
# nominal x=[0,0.8], y=[0.4,1.0] box -- worst case across all 9 panels.
# See validation/cooling/extractions/han_impingement.md for the
# per-panel numbers.

# UNCERTAINTY IS THE MEASUREMENT BAND, NOT THE MODEL'S ERROR (#389).
#
# Until 2026-09-29 every series here carried its OWN per-series
# `uncertainty`, ranging 0.03 to 0.324, and those values had been set from
# the model's measured error on that same series. The series whose
# `cross_check` reads "bias +31%, RMS 32%" carried a band of 0.324. So
# `within` was asking whether the model sits inside its own error, which it
# largely must: the declared band correlated with the measured RMS at
# r = +0.9987 over 27 series. That is the #332/#333 defect class living in
# the data rather than in a test.
#
# The band is now the same for every series, because both of its components
# are properties of the MEASUREMENT and neither is a property of a series:
#
#   experimental   +/-5% at 95% confidence. The primary paper's own Nu
#                  measurement uncertainty, quoted by Han and recorded as
#                  item 12 of the extraction. NOT item 23's 5.6% standard
#                  error, which is how well the CORRELATION fits its own
#                  data -- a property of the model, so out of bounds here.
#   digitisation   0.97%. Worst y-tick deviation from round numbers across
#                  all nine panels (see the calibration note above).
#
#   root-sum-square -> 0.051
#
# The experimental term dominates; digitisation adds 1.9% on top of it.
#
# EXPECTED CONSEQUENCE, stated up front: `within` for this source drops from
# 58.6% to whatever it really is. The old figure was not a measurement of
# anything.

paper:
  name: florschuetz1981
  citation: >-
    Florschuetz, L.W., Truman, C.R. and Metzger, D.E. (1981). "Streamwise Flow
    and Heat Transfer Distributions for Jet Array Impingement with Crossflow."
    ASME J. Heat Transfer 103, 337-342.
  secondary: false


