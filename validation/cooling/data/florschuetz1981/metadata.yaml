# flohrshuetz_truman_1981_fig_5.png: y calibrated on all six ticks (20-70,
# worst residual 0.16 Nu), x on the 2/4/6/8/10 ticks; markers at exactly
# yn/d = 4/6/8. Overlapping markers were separated by shape from zoomed crops
# (a marker is about 18 px tall; stacked centres sit 9 px in from the merged
# blob's edges; concentric pairs share the blob centre). User-confirmed on
# a scan overlay, 2026-10-06: accepted; a finer centroid would move points
# only marginally.
