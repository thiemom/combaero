    alpha_deg: null
    x_axis: Gc_Gj
    x_scale: 1.0
    y_axis: Nu_over_Nu1
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.324
    cross_check: >-
      Worst agreement in the set: this panel sits at the correlation's own
      validity corner (xn/d=5, yn/d=4, z/d=1 all simultaneously at their lower
      bounds) and florschuetz_1981_inline() underpredicts the measured
      crossflow degradation there, error growing from +14% at Gc/Gj=0.19 to
      +42% at Gc/Gj=0.72 (n=9, bias +31%, RMS 32%, max 42%). Calibration ticks
      on this same panel land within 0.9% of round numbers
      (rc_00_xaxis/yaxis), so this reads as a genuine weak spot of the fit at
      its own domain corner, not a digitisation artifact. Series is
      monotonically non-increasing with Gc/Gj.
    class_confidence: confirmed
    scores: florschuetz_1981_inline
    verification:
      x_axis_type: linear
      y_axis_type: linear
