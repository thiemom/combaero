# Rohde's orifice data as McGreehan and Schotsch replot it.
#
# WHY THIS SOURCE AND NOT ROHDE DIRECTLY. Rohde (NASA TN D-5467) plots Cd
# against a velocity head ratio (P_T - p_j)/(P_T - p_d) built from duct TOTAL
# conditions. McGreehan and Schotsch's Eq. (17) is written in U1/Vi with
# STATIC parameters, and they state (p.215) that "Rohde's results have been
# adjusted using static parameters" before plotting them. Digitising their
# Fig. 6 therefore takes the conversion from the people who defined both
# coordinate systems, instead of interposing a conversion of ours:
#
#     U1/Vi     = 1/sqrt(VHR - 1)
#     Cd_static = Cd_Rohde * sqrt(VHR/(VHR - 1))
#
# That conversion is derived and recorded in the extraction, but it is NOT
# used to produce these numbers, and it is divergent as VHR -> 1 (the factor
# is 4.1x at U1/Vi = 4), which is exactly where digitising Rohde directly
# would be least trustworthy.
#
# WHAT THE BASELINE MEANS. Fig. 6's curves are NOT chain predictions. The
# paper anchors them to "a set baseline point at U1/Vi = 0" taken from
# Rohde's own measurement (Cd:r,L = 0.64 here). The chain predicts 0.669 for
# the same geometry -- the paper's own remark that Rohde's "basic values are
# lower". Scoring this series against the full chain therefore conflates the
# baseline gap with the crossflow term; score it against
# mcgreehan_schotsch_1988_crossflow_cd(0.64, U1/Vi) instead.
#
# DIGITISATION STATUS: automated pass only, ONE channel. Detected by locating
# enclosed white holes (an open square's interior survives the marker touching
# the drawn curve, where connected-component size filtering does not), then
# verified by overlaying the detections on the source image. All 11 land on
# real markers with no visible misses. The companion '+' series on the same
# figure ((r/d, L/d) = (0, 4.0), baseline 0.73) is NOT committed: automated
# detection recovered only 3 of roughly 10 markers and picked up annotation
# text, so it needs a manual pass before it can be trusted.
#
# Axis calibration: six x ticks at 0..5, least-squares residual 0.0026 in
# U1/Vi. Verified visually against the overlay.

paper:
  name: mcgreehan_schotsch1988
  citation: >-
    McGreehan, W.F. and Schotsch, M.J. (1988). "Flow Characteristics of Long
    Orifices With Rotation and Corner Radiusing." ASME J. Turbomachinery
    110(2), 213-217. Paper No. 87-GT-162.
  secondary: true

files:
  - path: fig6_rohde_td0p51.csv
    after: >-
      Rohde, J.E., Richards, H.T. and Metzger, G.W. (1969). Discharge
      Coefficients for Thick Plate Orifices With Approach Flow Perpendicular
      and Inclined to the Orifice Axis. NASA TN D-5467. Model 1, t/d = 0.51,
      sharp inlet edge.
    page: 215
    item: "Figure 6, open-square series"
    series: "Rohde Cd vs U1/Vi, (r/d, L/d) = (0., 0.51), baseline Cd:r,L = 0.64"
    figure: "6"
    panel: single
    geometry:
      r_over_d: 0.0
      L_over_d: 0.51
      cd_baseline: 0.64
    alpha_deg: null
    x_axis: U1_over_Vi
    x_scale: 1.0
    y_axis: Cd
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.0026
    verification:
      # The abscissa is LINEAR (0 to 5, six ticks), not log. Declared
      # explicitly: verify.py defaults to log and would compute a decade
      # span over it, which is meaningless here.
      x_axis_type: linear
      x_ticks: [0, 1, 2, 3, 4, 5]
      x_multiplier: 1.0
      # Likewise linear: Fig. 6's ordinate runs 0 to 1 with a tick at 0.5.
      # The first redrawn plot came out on a log ordinate and looked entirely
      # plausible, which is the defect this declaration exists to prevent.
      y_axis_type: linear
      y_ticks: [0, 0.5, 1.0]
      y_multiplier: 1.0
      # Read off the page, independently of where the detector put anything:
      # 11 open squares, counted on the 500 dpi render, and the overlay shows
      # a detection on each with none left over.
      expected_points: 11
      # NOT monotonic. Eq. (17) rises before it falls, and these points
      # straddle the peak: the first six sit within 0.02 of each other around
      # Cd = 0.64 while U1/Vi climbs from 0.13 to 0.27. Asserting a trend
      # here would be asserting away the very feature the series documents.
      monotonic: null
      # No printed curve check: Fig. 6's drawn line is Eq. (17) anchored at a
      # measured baseline, not a printed closed form, so it is not an
      # independent channel the way a printed equation would be.
      printed_curve: null
    cross_check: >-
      Scored against Eq. (17) anchored at the figure's own 0.64 baseline:
      N=11, bias +5.95%, RMS 7.54%. The correlation reads high against Rohde
      and increasingly so with crossflow (+3% below U1/Vi = 0.4, +16% at
      1.41), consistent with the paper's statement that Rohde's values run
      low. The metric was falsified by perturbing U1/Vi: RMS moves to 26.4%
      at x0.5 and 17.9% at x2.0, so it is measuring the crossflow term and
      not an imposed quantity. Note a x1.25 scaling would reduce RMS to
      1.88% -- deliberately NOT applied, since Eq. (17) was fitted to Rohde,
      Grimm, and Meyfarth and Shine pooled, and refitting it to the one
      series it is being judged against is tuning against the score.
