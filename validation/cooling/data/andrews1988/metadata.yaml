# Andrews et al. (1988), ASME 88-GT-290 -- effusion wall INTERNAL heat
# transfer coefficient, Figure 8, the "C Effusion" series.
#
# WHY THIS SERIES AND NOT FIGURE 10. Fig. 10 plots the OVERALL cooling
# effectiveness, which is the obvious-looking validation target and the wrong
# one. Reproducing it needs a chain: a gas-side h (the rig is a propane
# preheater at 750 K and Mach 0.05, but the duct geometry is not given), the
# wall conduction, the internal convection AND the film. An error in an
# assumed gas-side h would be attributed to the effusion model. Fig. 8 is h
# against G directly -- one mechanism, no chain, no assumptions.
#
# Validating each mechanism on its own data is also what the double-counting
# split needs: if the combination is wrong later, we know which half.
# Fig. 10 remains a secondary sanity comparison with its assumptions stated,
# not a scorecard entry.
#
# WHAT h IS HERE. Per the paper's nomenclature, h is referenced to the plate
# approach area A = X^2 - pi D^2/4, NOT to the hole internal area A_h. So it
# is an EFFECTIVE internal coefficient per unit plate area, lumping the
# coolant-side hole approach and the throat convection -- which is exactly
# the quantity an effusion element needs, and a different number from a
# throat-only h. Comparing against a throat Nusselt number without the
# A/A_h conversion would be a definitional error of the #389 class.
#
# GEOMETRY -- Table 1, effusion plate C:
#   N = 4306 m^-2, D = 3.27 mm, X = 15.24 mm (printed as 15.2; see below),
#   X/D = 4.7, A/A_h = 3.4, plate thickness 6.3 mm, square array.
#
# X IS 0.6 INCH, NOT THE PRINTED 15.2 mm. 1/(15.2e-3)^2 = 4328, which is not
# the tabulated N = 4306; 1/(15.24e-3)^2 = 4305.8 is. The table prints a
# rounded conversion of an imperial pitch. Using 15.2 shows a spurious 0.5%
# error in any N = 1/X^2 check.
#
# EXTRACTION. Page rendered at 600 dpi with `pdftoppm -r 600`. Markers found
# by enclosed-hole topology -- an open circle keeps a white interior even
# where the fitted line crosses it -- then classified by hole fill ratio,
# which separates the three series cleanly and without reference to position:
#   triangle (A/C)      fill 0.53-0.65
#   circle   (C)        fill 0.76-0.82   (pi/4 = 0.785)
#   square   (A)        fill 0.85-0.97
# An overlay of the detections on the source was checked before the count was
# believed: 10 data circles plus the legend marker, none missed, none false.
#
# CALIBRATION, verified on six independent ticks. Log-log. The decade marks
# at G = 0.1 and 1.0 give 970.5 px/decade; on that scale the left and right
# frame edges land on 0.049 and 3.00 against the printed 0.05 and 3. The
# minor ticks at 0.06, 0.2, 0.4, 0.5 and 0.7 all reproduce within 0.6%.
# The y axis is pinned by the frame at 40 and 1000, and the major tick
# detected at y = 1098 px predicts 100.7 against the printed 100.
#
# PAGE SKEW IS PRESENT BUT BELOW THE DATA SCATTER. The bottom frame line
# drops 4.55 px from left to right, a 1.21% effect in h. The raw picks are
# committed uncorrected and `fig8_frame.csv` records the four frame corners
# so the correction is reproducible rather than a typed constant -- but it is
# NOT applied, because the series' own scatter about its power law is +/-16%,
# more than ten times larger. Correcting a 1.2% skew inside a 16% scatter
# would be false precision.
#
# THE SCATTER IS THE SOURCE'S, NOT THE EXTRACTION'S. A power-law fit gives
# h = 194 G^0.607 with R^2 = 0.981 and a worst residual of +16% at the lowest
# G. Both off-trend points were zoomed and inspected: the markers are cleanly
# isolated and exactly centred, and at the lowest G the paper's own fitted
# line does not even extend that far left. So the residual is 1988
# transient-technique measurement scatter, which is what an `uncertainty`
# band here should reflect -- but the paper states no per-point band, so it
# is left null rather than back-filled from the model error (#389).
#
# ============================================================================
# FIGURE 10: overall cooling effectiveness against G -- and the closure it
#            falsifies
# ============================================================================
#
# "Cooling effectiveness as a function of G for effusion B and C alone and
# impingement A alone and for the Imp/Eff combinations A/B and A/C and a
# comparison with transpiration walls." Page 7, eta = (Tg - Tw)/(Tg - Tc),
# the paper's Eq. (3).
#
# THIS FIGURE CLOSES #387's LAST PIECE, AND IT RESHAPES IT.
# The recorded plan was to produce overall eta as an OUTPUT of a resistance
# network -- internal convection from 86-GT-225 plus an external film from
# Baldauf and Sellers, added as separate terms. Andrews' data says those
# are not separable here, so the shipped closure lumps them:
#
#   eta = h_i / (h_i + h_gas)      h_gas supplied by the caller
#
# NOT "there is no film". The two-temperature form an external film really
# needs is
#
#   q = h_f (T_aw - T_w),   T_aw = T_g - eta_f (T_g - T_c)
#   eta = (h_i + h_f eta_f) / (h_i + h_f)
#
# and it takes BOTH eta_f and h_f. An adiabatic effectiveness correlation
# supplies only the first: an adiabatic wall passes no heat, so the
# experiment fixes T_aw and says nothing about the coefficient.
#
# WHAT BALDAUF DOES CONTAIN, since an earlier reading of this had it
# backwards. The counter-rotating vortex pair entraining hot gas under a
# lifted jet changes T_aw -- exactly what IR on an insulated wall records.
# Baldauf HAS that, in Eq. (38)'s decay branch, and steeply: the falling
# exponent b_pk = exp(1.92 - 7.5 (s/D)^-1.5) is 4.57 at plate B's spacing
# and 3.24 at plate C's. Andrews' own "jet stirring of the cooling film"
# sentence describes that same film destruction, so it names a mechanism
# Baldauf models rather than a missing one.
#
# THE MEASUREMENT, READ BOTH WAYS:
#   * film offered alone at the smooth-duct h_g -- REFUSED. The admissible
#     eta_f is negative at all 66 of plate B's points and reaches at most
#     +0.105 on plate C, against 0.27 to 0.58 from Baldauf over ten rows.
#   * film admitted with its matching augmentation -- CONSISTENT. The same
#     measurement then demands F = h_f/h_0 of 1.6 to 4.3.
#
# Only the pair is identifiable from one eta curve, so the caller supplies
# it as one h_gas. That form has zero free parameters, which is what makes
# it falsifiable where the split form fits anything. See
# `validation/cooling/extractions/andrews_effusion_overall_eta.md`.
#
# THE B/C SPLIT IS THE REAL FINDING, and the ratio needs no assumed gas
# side at all -- h_0 divides out of it:
#
#     required h_gas, plate B / plate C     G=0.6   G=1.0   G=1.4
#       with no film term                    1.82    1.86    1.96
#       with Baldauf's own film              1.75    1.67    1.79
#
# Plate B needs about 1.7x plate C's gas-side coefficient EITHER WAY.
# Admitting the film does not explain the split, so the residual is a
# geometry dependence two plates cannot separate from a jet one. Three
# candidates survive and none is chosen: Baldauf extrapolating hard (M to
# 7.0 against a 2.5 limit, s/D 7.06 against 5), a genuine difference in
# h_f/h_0, and Sellers over ten rows, which Gao et al. (2025) measure as
# always overestimating and accumulating with row count.
#
# THE ABSOLUTE LEVEL IS CONFOUNDED; THE RATIO IS NOT. The test plate sits
# only x/D_h = 1.5 into the duct, deep in the entry region where
# Dittus-Boelter's fully developed value understates h_0. A standard entry
# correction raises it 1.75x -- from 46 to 81 W/m2K -- and brings plate C's
# required F to 0.9-1.6, ordinary film-cooling augmentation. Not applied,
# because the runner's job is to report the rig as the paper describes it;
# recorded so the absolute F values are not over-read.
#
# NO THRESHOLD IS OFFERED, BECAUSE THE DATA DOES NOT SUPPORT ONE.
# The enhancement was tested for collapse against the velocity ratio, the
# blowing ratio and the momentum flux ratio. It collapses on NONE of them:
# at equal VR the two plates still differ by 1.5-1.6x, at equal M by
# 1.35-1.45x, at equal I by 1.3-1.5x. Two plates cannot separate a jet
# parameter from a geometry one, so the runner REPORTS VR, M and I beside
# the result and fits nothing.
#
# WHY NO COOLANT HEAT-UP TERM. The coolant gains 12 K at G = 1.4 and 60 K
# at G = 0.2 passing through the wall, so an explicit heat-up looks
# obviously missing. It is not: 86-GT-225's h is fitted from the plate's
# transient cooling rate against the SUPPLY temperature (Eqs. 1-2 here), so
# the heat-up is already inside it. The evidence is that adding it does not
# flatten the error -- it tilts it. Without: plate C runs -2.8% to +5.8%
# across G (8.6 points). With: -8.8% to +4.2% (13 points). A genuinely
# missing G-dependent term would have shown as a G-dependent error, and the
# error has no such trend.
#
# Wall conduction is omitted for the same reason and is small anyway:
# 6.3 mm of Nimonic 75 is 5.7e-4 m2K/W, 3.5% of 1/h_i, and the transient
# technique lumps the plate (m Cp) so the through-wall gradient is inside
# the measured h too.
#
# THE FIGURE AND THE TEXT DISAGREE, TWICE. Recorded, not resolved:
#   * the plot prints "Tg = 744K, Tc = 293K"; the body text says the
#     measurements "were made at a Tg of 750K and Tc of 295K". The runner
#     uses the text's values and reports the sensitivity; the difference is
#     worth under 0.5% on eta because eta is a ratio.
#   * the plot prints "Z = 6.4mm"; page 3 says "An 8 mm impingement gap was
#     used throughout", and Z is defined as the impingement gap. It does
#     not touch the effusion-only curves B and C, which are the scored
#     ones.
#
# THE PAGE IS ROTATED AND THE RAW PICKS ARE COMMITTED ANYWAY. The frame
# corners give 0.94% skew read as y-per-x-span and 0.96% read as x-per-y-
# span -- two independent measurements of one real rotation. But the
# digitiser's own affine already absorbed it: applying the four-corner
# inverse makes the y ticks WORSE, from a worst error of 0.00178 (0.30% of
# the span) to 0.00255, and leaves the x ticks unchanged at 0.44%. The
# third channel cannot separate them either (Table 3, below, scores 0.57
# against 0.52 percentage points). Uncorrected, per the evidence.
#
# TABLE 3 IS A THIRD CHANNEL AND IT VALIDATES THE CURVE LABELS, NOT JUST
# THE COORDINATES. Page 7 tabulates the ratios BETWEEN these curves at
# G = 0.2, 0.5 and 1.0. Read as (eta_num - eta_den)/eta_den, the
# digitisation reproduces all nine printed cells to 0.57 percentage points
# mean -- including A/B vs A_imp at 6.5% against 6% and A/C vs C at 20.0%
# against 20%. The table's dashes in the A_imp columns at G = 0.2 match the
# A_imp curve starting at G = 0.487. Pinned by
# `test_fig10_reproduces_the_papers_own_table_3`.
#
# WHAT IS SCORED AND WHAT IS NOT. Only B and C, the effusion-only curves,
# are scored: they are the only ones combaero models. A/B, A/C and A alone
# need an impingement closure that does not exist here, and the porous
# wall, Lamilloy and Transply curves are other people's measurements of
# other technologies (refs 14, 18, 19, 20) -- committed because they set
# the scale effusion is being judged against, scored by nothing.

