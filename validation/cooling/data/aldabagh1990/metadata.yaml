# Al Dabagh, A. M., Andrews, G. E., Abdul Husain, R. A. A., Husain, C. I.,
# Nazari, A., Wu, J. (1990). "Impingement/effusion cooling: the influence of
# the number of impingement holes and pressure loss on the heat transfer
# coefficient." ASME J. Turbomachinery 112, 467-476 (89-GT-188).
#
# Leeds transient rig, the same group and the same h definition as
# andrews1988: whole-wall h on the effusion plate referenced to the plate
# approach area, +-5% per the paper. Z = 8 mm, no net gap crossflow (all jet
# air leaves through the effusion holes), effusion wall X/D 4.67 in both
# configurations here. Table 1:
#   config 3: impingement N 4306 m^-2 over effusion N 4306 (1:1), imp. X/D 11,
#             Ae/Ai 5.6;
#   config 5: impingement N 1076 over effusion N 4306 (1:4, Hollworth &
#             Dagan's jet-to-vent ratio), Ae/Ai 5.3.
# Fig. 16 also re-plots impingement ALONE at N 1076, X/D 10.6 (Andrews 1985d).
#
# WHY THESE SERIES. #468's wanted question: does the jet-to-vent ratio
# reconcile Cho & Rhee's Re^0.558 with Hollworth & Dagan's 0.80? This paper is
# the only local study that changes jets-per-vent at fixed effusion wall.
# Power-law fits to the points below (h ~ G^n, least squares in log-log):
#   config 3 (1:1)  n = 0.73 (0.75 on the G range common with config 5)
#   config 5 (1:4)  n = 0.58 (0.61 on the common range)
#   impingement only n = 0.87
# So going from 1:1 to H&D's 1:4 LOWERS the exponent: the ratio does not
# explain H&D's 0.80, and 1:4 sits near Cho & Rhee. h5/h3 from the fits is
# 1.04 at G 0.1, 0.88 at 0.3, 0.73 at 1.0 kg/m2s, matching the text ("about
# 20 percent lower at G 1-2, negligible below 0.3"). At fixed hole diameters
# the G exponent equals the Re exponent.
#
# DIGITISATION (2026-10-28, automated, page images at 300 dpi):
#   * log-log frames: Fig. 14 log G -1..1, log h 1..3; Fig. 16 log G -2..1,
#     log h 1..3; calibration from the frame lines.
#   * Fig. 14: the filled asterisks (config 3) only; Fig. 16: asterisks
#     (config 5) and circles (impingement only).
#   * config 5's lowest point (G 0.08) sits above the fit line, as printed;
#     it is a real symbol. The common-range fits exclude it.
#   * user-confirmed (2026-10-29) on a scan overlay: calibrated frame on the
#     printed axes, every cross on its symbol.
#
# WHY UNSCORED. Whole-wall h: accuracy (cross-source) only, never a
# coolant-side fidelity set, and it cannot separate jet from vent heat
# transfer. It becomes the cross-source check for whichever exponent the
# impingement-effusion element takes (#468); no set scores it yet.

