  # -- Figure 4.48: narrow-aspect-ratio channels (Eq. 4.19) ---------------
  #
  # After Han, J.C. et al. (1988), IJHMT 31(1), 183. Two panels STACKED,
  # (a) R vs alpha top, (b) G vs e+ bottom -- unlike 4.47's side-by-side
  # layout, this matches 4.51's stacking, but shares NO abscissa with it:
  # each panel has its own.
  #
  #   (a)  R vs alpha,  x LINEAR (ticks every 15 deg, labelled 90,60,45,30),
  #        y LINEAR (ticks every 0.5 from 1.5, every 1 above 5). NOTE: read
  #        off the page as log at first pass; the half-integer minor ticks
  #        (1.5, 2.5, 3.5, 4.5) are the tell that rules that out -- a log
  #        axis never places a minor tick at a half-integer, only linear
  #        does. Confirmed on the printed page (one minor tick exactly
  #        centred between each major label) and independently by the
  #        frame's own picks.
  #   (b)  G vs e+, both LOG, same ticks as every other e+ panel in this
  #        dataset (50, 100, 200, 300, 500, 1000 -- no multiplier).
  #
  # NO LEGEND, but attribution is possible by marker FILL, unlike figure
  # 4.47: solid = W/H 1/4, open = W/H 2/4, confirmed by the caption arrows
  # AND cross-validated against the physics -- R must increase as W/H
  # decreases, and the solid (nominally smaller W/H) points measure higher
  # R at every alpha than the open points do, exactly as required.
  #
  # A third curve, labelled "W/H = 2/2 [Ref. 3]" on the figure, is drawn
  # with NO scatter markers of its own -- only a line, with error bars at
  # a few points. "[Ref. 3]" is not resolved to a specific citation here;
  # it is not claimed to be any particular paper. What is measurable is
  # that its R curve matches Eq. 4.17 (W/H=1, m=0) to 4.16% RMS, and its G
  # curve matches Eq. 4.18's square-channel form (C=2.24, n=0.35) to 3.70%
  # RMS -- both already confirmed on figures 4.46/4.47. So whatever "[Ref.
  # 3]" is, its plotted line reproduces correlations this project already
  # has independent evidence for.
  #
  # NOTHING IN THIS FIGURE IS SCORED. Three separate reasons, not one:
  #
  #   1. W/H = 0.5 and 0.25 (the new narrow-channel data) fall OUTSIDE
  #      han_1988_orthogonal's valid_WH = [1, 4] -- this figure's whole
  #      point is behaviour the implemented set does not cover, and the
  #      correlation lines are the acceptance data for the eventual
  #      extension (Eq. 4.19), same treatment as figure 4.47.
  #
  #   2. The "[Ref. 3]" W/H=1 curve sits inside the implemented set's
  #      valid range, but it is a DRAWN LINE (with error bars describing
  #      its own reported scatter, not independent raw measurement) --
  #      the established rule from figures 4.46/4.51 is to never score a
  #      digitised drawn line, only data and printed equations.
  #
  #   3. Even where the "[Ref. 3]" curve overlaps the implemented set's
  #      domain, THE TWO PUBLISHED FORMS DISAGREE WITH EACH OTHER. Eq.
  #      4.17 evaluated at alpha=90 gives R=3.10 against Han (1988)'s
  #      direct R=3.2 (-3.1%); Eq. 4.18's square-channel form gives
  #      G=2.24(e+)^0.35 against han_1988_orthogonal's G=3.7(e+)^0.28,
  #      diverging from -20.9% at e+=70 to -11.4% at e+=404. Scoring the
  #      "[Ref. 3]" G data against han_1988_orthogonal would report that
  #      15-20% gap as model error, when it is a cross-paper exponent
  #      disagreement (0.35 vs 0.28) that exists independently of any
  #      W/H<1 question. Both comparisons are recorded below as text,
  #      not as a scored number that would blend the two effects.
  #
