    kind: measured
    extraction: figure-digitised
    confidence: band
    class_confidence: disputed
    uncertainty: 0.06
    cross_check: >-
      DISPUTED CLASS DATA -- pool, never use per-class, and exclude from
      any G_bar/G conclusion. This class returns G_bar/G below 1, which is
      impossible: G_bar averages the ribbed and smooth sides and the
      smooth side carries the lower h, so G_bar > G strictly. Its two
      panels hold what appear to be the same marks -- points agreeing
      within 2%, abscissae within 0.3%.

      Three readings survive and the digitised data separates none:
      (1) the figure duplicates this class's G marks into the G_bar panel,
      (2) it duplicates the other way, (3) this configuration genuinely
      has G_bar ~ G, its smooth wall performing nearly as well as its
      ribbed wall. Reconstructing the missing panel from the seven clean
      classes makes (1) consistent with Han's text and (2) inconsistent,
      but that is an inference from the TEXT, not evidence about the PLOT,
      and plausibility does not promote a reading.

      NEEDS THE PRIMARY PAPER: Han, J.C. et al. (1985/1991), ASME J. Heat
      Transfer 113, 590 -- not the reprint. Whether the two panels rank
      configurations identically turns on exactly this pair and stays open
      until then.
    scores: han_1988_orthogonal
    verification:
      x_axis_type: log
      y_axis_type: log
      x_ticks: [1, 2, 4, 6, 10]
      x_multiplier: 1.0e2
      y_ticks: [10, 20, 30, 40]
