  # -- Figure 4.46 panel frames: distortion standards, not data ----------
  #
  # A plot frame is horizontal by construction, so its fitted slope is the
  # panel's distortion and nothing else. Unlike a printed equation it does
  # not assume the draftsman drew the equation faithfully -- which is the
  # very thing in question when a line and its label disagree.
  #
  # Both panels come out flat to picking noise (upper +0.00078, lower
  # -0.00036, neither monotonic), against the drawn R line's +0.00857.
  # That is what establishes the R rise as drafting rather than scan skew.

  - path: fig4.46_frame_upper.csv
    after: "Han, J.C. (1988). ASME J. Heat Transfer 110, 321."
    page: 376
    figure: "4.46"
    panel: upper
    item: "Figure 4.46 upper panel, bottom frame line"
    series: "panel frame, picked as a distortion standard"
    geometry: null
    alpha_deg: null
    x_axis: e_plus
    x_scale: 1.0
    y_axis: frame_position
    kind: frame
    extraction: figure-digitised
    confidence: band
    uncertainty: null
    cross_check: >-
      Slope must be zero: the frame is horizontal by construction. Measured
      +0.00078, non-monotonic. The frame also lands at y = 7.65, just below
      the lowest labelled tick of 8, which confirms the ordinate
      calibration from a direction the tick marks cannot.
    scores: null
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [40, 1200]
      plot_y_limits: [8, 42]
      kind: frame
      x_ticks: [50, 100, 200, 300, 500, 1000]
      x_multiplier: 1.0
      y_ticks: []
      frame_tolerance: 0.002
      monotonic: null
      expected_points: null

  - path: fig4.46_frame_lower.csv
    after: "Han, J.C. (1988). ASME J. Heat Transfer 110, 321."
    page: 376
    figure: "4.46"
    panel: lower
    item: "Figure 4.46 lower panel, bottom frame line"
    series: "panel frame, picked as a distortion standard"
    geometry: null
    alpha_deg: null
    x_axis: e_plus
    x_scale: 1.0
    y_axis: frame_position
    kind: frame
    extraction: figure-digitised
    confidence: band
    uncertainty: null
    cross_check: >-
      Slope must be zero. Measured -0.00036, non-monotonic, and NEGATIVE
      while the R line drawn in this same panel rises at +0.00857 -- 23x
      the distortion and in the opposite direction. This is the measurement
      that rules out scan skew as the explanation for extraction item 7.
    scores: null
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [40, 1200]
      plot_y_limits: [2, 5.2]
      kind: frame
      x_ticks: [50, 100, 200, 300, 500, 1000]
      x_multiplier: 1.0
      y_ticks: []
      frame_tolerance: 0.002
      monotonic: null
      expected_points: null

  # -- Figure 4.46: the source figure for han_1988_orthogonal -------------
  #
  # Both panels, all ten symbol classes, plus the three drawn correlation
  # lines. After Han, J.C. (1988), ASME JHT 110, 321.
  #
  # CLASS ATTRIBUTION IS PROVISIONAL. Symbols are similar and overlap, so a
  # mark cannot always be assigned to its class with confidence, and not
  # every run appears in both panels -- some marks merge, some were never
  # plotted. This costs nothing here: han_1988_orthogonal carries ZERO
  # geometry exponents in both R and G, Han normalised P/e out of the R
  # ordinate himself, and W/H drops at alpha = 90 (Eq. 4.17 has m = 0). So
  # every class must land on one curve and the POOLED cloud is the scored
  # path. The labels are kept as provenance, not as something scoring leans
  # on -- see the confidence note on each series.
  #
  # Two marks were dropped as contaminants, each sitting outside its
  # class's physically possible e+ range: 1078.2 from eD0.047/pe20/wh2 and
  # 57.5 from eD0.063/pe10/wh1.
  #
  # MEASURED SCATTER: pooled R gives +0.29% bias with sd 5.94% (70% within
  # 6%); pooled G gives -2.97% with sd 6.13%. Han states "within 6% for 95%
  # of the data", but 70% inside 6% with sd 5.9% says 6% is a STANDARD
  # DEVIATION, not a 95% bound. Harness tolerances are set from that.

  - path: fig4.46_R_eD0.047_pe10_wh1.csv
    after: "Han, J.C. (1988). ASME J. Heat Transfer 110, 321."
    page: 376
    figure: "4.46"
    panel: lower
    item: "Figure 4.46 lower panel"
    series: "this study, e/D 0.047, P/e 10, W/H 1, Re 10,000-60,000"
    geometry: {e_D: 0.047, p_e: 10, W_H: 1}
    alpha_deg: 90.0
    x_axis: e_plus
    x_scale: 1.0
    y_axis: R_normalised
    kind: measured
    extraction: figure-digitised
    confidence: band
    class_confidence: provisional
    uncertainty: 0.06
    cross_check: >-
      Class attribution is PROVISIONAL (overlapping symbols). What is
      checkable: every mark lies on the lower panel, and the class's e+
      span agrees with what Re 10,000-60,000 and e/D 0.047 predict through the
      friction chain. Scoring uses the pooled cloud, not this label.
    scores: han_1988_orthogonal
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [40, 1200]
      plot_y_limits: [2, 5.2]
      x_ticks: [50, 100, 200, 300, 500, 1000]
      x_multiplier: 1.0
      y_ticks: [2, 3, 4, 5]
      printed_curve: null
      monotonic: null
      expected_points: null

