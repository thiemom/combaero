  # -- Figure 4.47: the angled-rib correlation, Han and Park (1988) -------
  #
  # After Han, J.C. and Park, J.S. (1988), IJHMT 31(1), 183. Two panels
  # side by side, NOT stacked, and they share no axis:
  #
  #   left   R/[(P/e/10)^0.35 (W/H)^m] against alpha, x LINEAR (ticks every
  #          10 deg from 90 to 30, labelled only at 90, 60, 40, 30), y LOG
  #   right  G or G_bar against e+, both LOG, ticks 50..1000 with NO
  #          multiplier -- unlike figures 4.51 and 4.54
  #
  # Each panel's axis runs a decade past its labels to make room for the
  # parameter inset: the left y-frame sits at 0.1, one decade below the
  # "1" label, and the right y-frame reaches 97.9 against a top label of
  # 30. Neither is a stray pick; both are the real frame.
  #
  # This is the source of extraction item 10: G_bar = 1.2 G is printed on
  # the right panel's dashed line. Figure 4.51 later measured it at 1.2193.
  #
  # Points are POOLED, and here pooling is FORCED rather than chosen.
  # Both panels draw several distinct symbols but carry NO LEGEND -- the
  # figure never says which symbol is which geometry. On figures 4.46 and
  # 4.51 a legend made attribution hard-but-possible, so class labels were
  # recorded as provisional; here there is nothing to attribute against,
  # and a per-class split would be invention.
  #
  # It costs little. The left panel's ordinate is already normalised by
  # (P/e/10)^0.35 (W/H)^m, so geometry is divided out by construction. The
  # right panel's is not, so its COEFFICIENT is a mixture over the stated
  # ranges and only its EXPONENT is directly comparable -- which is what
  # the cross_check tests.
  #
  # NOT SCORED by any implemented set. han_1988_orthogonal binds 90 deg
  # only; this figure IS the angled-rib correlation and needs a
  # han_park_1988_angled set, for which it is the acceptance data (#334).

