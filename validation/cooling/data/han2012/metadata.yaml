# Digitised points from figures in Han, Dutta & Ekkad (2012).
#
# The book is a SECONDARY source for every series here: each figure is
# reprinted from a primary paper, named per-series under `after`. The
# scans stay gitignored under docs/heat_transfer/; only these coordinates
# are committed.

paper:
  name: han2012
  citation: >-
    Han, J.C., Dutta, S. and Ekkad, S. (2012). Gas Turbine Heat Transfer
    and Cooling Technology, 2nd Edition. CRC Press.
  secondary: true

files:
  # -- Figure 4.54: G_bar against e+ -------------------------------------
  #
  # The digitised x axis is e+ / 1e4, established from two independent
  # channels that agree:
  #
  #   READ: the printed abscissa is labelled `e+ x 10^-2` with ticks at
  #   1, 2, 4, 6, 8, 10, so the figure spans e+ = 100 to 1000. Applying
  #   x_scale = 1e4 places the digitised points at e+ = 179 to 972, inside
  #   that span and filling it.
  #
  #   FITTED: only x_scale = 1e4 reproduces the extraction's free fits
  #   (G_bar = 4.201 e+^0.2952 for the 90 deg line, 3.242 e+^0.2882 for the
  #   45 deg V data) -- 0.5-1.9% RMS, against 48-97% at every neighbouring
  #   decade.
  #
  # The digitiser evidently calibrated on the tick labels without the
  # `x 10^-2` multiplier, shifting two decades; the fitted channel found
  # the same shift the printed axis states. Figure 4.51 carries the same
  # `x 10^-2` axis and will need the same treatment.
  #
  # Both series below are read from the LOWER panel (G_bar). The figure has
  # two panels, G above and G_bar below, sharing one abscissa.

  - path: fig4.54_90deg_continuous_Gbar_curve.csv
    after: "Han, J.C. and Zhang, Y.M. (1992). IJHMT 35(2), 513."
    page: 386
    figure: "4.54"
    panel: lower
    item: "Figure 4.54"
    series: "90 deg continuous rib, drawn correlation line"
    geometry: null          # not stated in the extracted text; see note below
    alpha_deg: 90.0
    x_axis: e_plus
    x_scale: 1.0e4
    y_axis: G_bar
    kind: correlation
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.06       # Han's stated 6% for 95% of the data
    cross_check: >-
      Free fit gives G_bar = 4.201 e+^0.2952 against the confirmed
      G_bar = 1.2 * 3.7 e+^0.28 = 4.44 e+^0.28, agreeing to 3.5%. This
      reaches item 10 (G_bar = 1.2 G) from a different paper, a different
      figure and a different rib family than the label it was settled by.
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [100, 1100]
      plot_y_limits: [10, 40]
      # Abscissa prints as `e+ x 10^-2`, ticks 1 2 4 6 8 10 -> e+ 100..1000.
      x_ticks: [1, 2, 4, 6, 8, 10]
      x_multiplier: 1.0e2
      y_ticks: [10, 20, 30, 40]
      # The dashed line is labelled "Correlation for 90 deg Continuous ribs
      # [3]" -- a citation, not an equation. Nothing printed to check against.
      printed_curve: null
      monotonic: increasing
      expected_points: 7
    scores: han_1988_orthogonal

  - path: fig4.54_90deg_continuous_Gbar_data.csv
    after: "Han, J.C. and Zhang, Y.M. (1992). IJHMT 35(2), 513."
    page: 386
    figure: "4.54"
    panel: lower
    item: "Figure 4.54"
    series: "90 deg continuous rib, measured points"
    geometry: null
    alpha_deg: 90.0
    x_axis: e_plus
    x_scale: 1.0e4
    y_axis: G_bar
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.06
    cross_check: >-
      Scatter about its own drawn line (the curve series above) must exceed
      the line's own deviation from the correlation; 5.4% against 3.5%.
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [100, 1100]
      plot_y_limits: [10, 40]
      x_ticks: [1, 2, 4, 6, 8, 10]
      x_multiplier: 1.0e2
      y_ticks: [10, 20, 30, 40]
      printed_curve: null
      monotonic: increasing
      # NEEDS HUMAN READ: filled circles in the lower panel overlap the
      # dashed line; count them on the page.
      expected_points: null
    scores: han_1988_orthogonal

  - path: fig4.54_45deg_vbroken_Gbar_data.csv
    after: "Han, J.C. and Zhang, Y.M. (1992). IJHMT 35(2), 513."
    page: 386
    figure: "4.54"
    panel: lower
    item: "Figure 4.54"
    series: "45 deg V-shaped broken rib, measured points"
    geometry: null
    alpha_deg: 45.0
    x_axis: e_plus
    x_scale: 1.0e4
    y_axis: G_bar
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.06
    cross_check: >-
      Free fit gives G_bar = 3.242 e+^0.2882 against the 90 deg line's
      4.201 e+^0.2952. Lower G is better heat transfer, so this series must
      sit BELOW the 90 deg line across the range -- 0.739 of it at
      e+ = 500 -- matching the text's claim that broken V ribs are the best
      performers of the group. A sign error in the digitisation would
      invert it.
    # Deliberately NOT scored: broken V ribs are a different rib family and
    # han_1988_orthogonal has no binding for them. Carried because it is the
    # reference point behind the extraction's "26% better" claim, and a
    # scorecard row of 'unsupported' is more honest than omitting the series.
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [100, 1100]
      plot_y_limits: [10, 40]
      x_ticks: [1, 2, 4, 6, 8, 10]
      x_multiplier: 1.0e2
      y_ticks: [10, 20, 30, 40]
      printed_curve: null
      monotonic: increasing
      # NEEDS HUMAN READ: the lower panel's open symbols are dense and the
      # 45 deg V class must be separated from 45 deg parallel by shape.
      expected_points: null
    scores: null

  # -- Figure 4.193c: G against e+, extended Reynolds range ---------------
  #
  # x is e+ directly here; no scale recovery was needed.

  - path: fig4.193c_old_correlation_G_curve.csv
    after: "Rallabandi, A.P., Yang, H. and Han, J.C. (2009). ASME J. Heat Transfer 131, 071703."
    page: 513
    figure: "4.193c"
    panel: single
    item: "Figure 4.193c, curve labelled 'old correlation'"
    series: "Han/Han-Park correlation as printed on the figure"
    geometry: null
    alpha_deg: 45.0
    x_axis: e_plus
    x_scale: 1.0
    y_axis: G
    kind: correlation
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.08
    cross_check: >-
      Free fit must recover the printed exponent 0.35 rather than the new
      correlation's 0.42; the two curves are separated by that exponent.
      Confirmed by han_ribbed_high_re.md item 26: matches Eq. 4.18's
      square-channel form at alpha=45 (the "30<alpha<90" branch, C=1.80) to
      3.5%. Not scored: a drawn line (never a source of truth), and there is
      no implemented set for Han's angled correlation at alpha=45 yet --
      han_1988_orthogonal is alpha=90 only.
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [80, 32000]
      plot_y_limits: [6, 120]
      # Plain e+ abscissa, log decades 10^2 10^3 10^4.
      x_ticks: [100, 1000, 10000]
      x_multiplier: 1.0
      y_ticks: [20, 40, 60, 80, 100, 120]
      # Log axis; minor ticks continue below the lowest LABELLED tick, and
      # the 1984/1986 reference marks sit near G = 8. The lower bound is
      # not readable off the scan, so it is left unchecked rather than
      # guessed. The upper bound still catches an upward decade error.
      y_limits: [null, 120]
      # Printed on the figure as
      #   G = 2.24 (W/H)^0.1 (alpha/90)^0.35 (p/e/10)^0.1 e+^0.35
      # The coefficient depends on the geometry the curve was drawn at,
      # which the figure does not state, so only the exponent is checkable.
      printed_exponent: 0.35
      exponent_tolerance: 0.03
      monotonic: increasing
      expected_points: 6
    scores: null

  - path: fig4.193c_new_correlation_G_curve.csv
    after: "Rallabandi, A.P., Yang, H. and Han, J.C. (2009). ASME J. Heat Transfer 131, 071703."
    page: 513
    figure: "4.193c"
    panel: single
    item: "Figure 4.193c, curve labelled 'new correlation'"
    series: "extended-range correlation as printed on the figure"
    geometry: null
    alpha_deg: 45.0
    x_axis: e_plus
    x_scale: 1.0
    y_axis: G
    kind: correlation
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.08
    cross_check: >-
      Free fit must recover the printed exponent 0.42, distinguishing it
      from the old-correlation curve.
    # The extended-range set is not implemented: extraction item 20 records
    # that (e/D)^0.14 as transcribed contradicts the figure, and item 19
    # records the matching friction correlation as missing outright.
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [80, 32000]
      plot_y_limits: [6, 120]
      x_ticks: [100, 1000, 10000]
      x_multiplier: 1.0
      y_ticks: [20, 40, 60, 80, 100, 120]
      # Log axis; minor ticks continue below the lowest LABELLED tick, and
      # the 1984/1986 reference marks sit near G = 8. The lower bound is
      # not readable off the scan, so it is left unchecked rather than
      # guessed. The upper bound still catches an upward decade error.
      y_limits: [null, 120]
      # Printed as G = 1.24 (e/D)^0.14 (p/e)^-0.031 e+^0.42. The exponent
      # on e+ is what separates this curve from the old one (0.35).
      printed_exponent: 0.42
      exponent_tolerance: 0.03
      monotonic: increasing
      expected_points: 6
    scores: null

  - path: fig4.193c_G_scatter.csv
    after: "Rallabandi, A.P., Yang, H. and Han, J.C. (2009). ASME J. Heat Transfer 131, 071703."
    page: 513
    figure: "4.193c"
    panel: single
    item: "Figure 4.193c, data cloud"
    series: "sharp-edged 45 deg ribs, all measured points, unclassified"
    geometry: {e_D: 0.14, p_e: 7.5, W_H: 1.0}
    alpha_deg: 45.0
    x_axis: e_plus
    x_scale: 1.0
    y_axis: G
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.069
    cross_check: >-
      The cloud must straddle the new-correlation curve and sit above the
      old one at high e+, which is the figure's whole point. Scored against
      rallabandi_2009_high_re (Eq. 18): han_ribbed_high_re.md's own
      comparison, evaluating G(e+) directly, gives mean pred/data 0.994,
      RMS 6.9%. The geometry here is a REPRESENTATIVE value, not per-point
      truth -- the cloud was digitised without symbol classification, so
      individual e/D and p/e are unrecoverable. This barely matters:
      Rallabandi's own text states "G does not vary much with e/D or p/e",
      matching the correlation's own near-zero exponents (0.014, -0.02).
      e_D=0.14, p_e=7.5 are the midpoints of the set's stated validity
      ranges (0.1-0.18, 5-10).
    verification:
      x_axis_type: log
      y_axis_type: log
      plot_x_limits: [80, 32000]
      plot_y_limits: [6, 120]
      x_ticks: [100, 1000, 10000]
      x_multiplier: 1.0
      y_ticks: [20, 40, 60, 80, 100, 120]
      # Log axis; minor ticks continue below the lowest LABELLED tick, and
      # the 1984/1986 reference marks sit near G = 8. The lower bound is
      # not readable off the scan, so it is left unchecked rather than
      # guessed. The upper bound still catches an upward decade error.
      y_limits: [null, 120]
      printed_curve: null
      # Scatter, so no trend is asserted point to point.
      monotonic: null
      # NEEDS HUMAN READ: the legend carries 11 symbol classes (e/d 0.1,
      # 0.15, 0.18 x p/e 10, 7.5, 5, plus 1984 and 1986 reference sets) and
      # this CSV pools them all. Count the marks on the page.
      expected_points: null
    scores: rallabandi_2009_high_re

  # -- Figure 4.53: Nu ratio against friction ratio -----------------------
  #
  # Carried as data, not scored. The axes are a thermal-performance curve
  # (Nu_r/Nu_s against f/f_s), and scoring it needs both a Nusselt and a
  # friction binding for BROKEN ribs, which no implemented set has.

  - path: fig4.53_90deg_continuous_Nu_ratio.csv
    after: "Han, J.C. and Zhang, Y.M. (1992). IJHMT 35(2), 513."
    page: 385
    figure: "4.53"
    panel: upper
    item: "Figure 4.53, solid circles"
    series: "90 deg continuous rib, ribbed-side Nu ratio"
    geometry: null
    alpha_deg: 90.0
    x_axis: f_ratio
    x_scale: 1.0
    y_axis: Nu_ratio
    kind: measured
    extraction: figure-digitised
    confidence: band
    uncertainty: 0.08
    cross_check: >-
      Nu ratio must fall and f ratio rise with Reynolds number along the
      series, the trend the section text states for all ribs.
    verification:
      x_axis_type: linear
      y_axis_type: linear
      plot_x_limits: [0, 12]
      plot_y_limits: [0, 6]
      # Linear axes, upper (ribbed-side) panel.
      x_ticks: [0, 2, 4, 6, 8, 10, 12]
      x_multiplier: 1.0
      y_ticks: [0, 1, 2, 3, 4, 5, 6]
      printed_curve: null
      # NOT declared: the text's "Nu ratio falls as f ratio rises with Re"
      # holds across the sweep, but these five marks overlap inside a tight
      # cluster and one adjacent pair inverts. Flagging that as a defect
      # would be a check that fails on correct data.
      monotonic: null
      expected_points: null
    scores: null

  - path: fig4.53_60deg_vcontinuous_Nu_ratio.csv
