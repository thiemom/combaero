# The Han and Zhang (1992) rig geometry (e/D, P/e, W/H) is NOT stated in the
# extracted text and is recorded as missing rather than guessed. It costs
# nothing for han_1988_orthogonal, whose G carries zero exponents on all
# three -- G = 3.7 (e+)^0.28 and nothing else. Any set with a geometry
# binding cannot be scored against these series until the primary paper
# supplies it, and the runner refuses rather than substituting a default.
