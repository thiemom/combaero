# Chyu, M.K. (1990). "Heat Transfer and Pressure Drop for Short Pin-Fin Arrays
# With Pin-Endwall Fillet." ASME J. Heat Transfer 112, 926-932.
#
# Carnegie Mellon (naphthalene sublimation). Inline (7 rows x 5 pins) and
# staggered (7 rows, 5/4 pins) arrays, H/D = 1, S/D = X/D = 2.5, straight and
# pin-endwall-FILLET ("spool") pins. Channel 159 x 12.7 mm, D_h 23.5 mm.
#
# FIGURE 6 is the only friction data in the paper; no correlation is printed.
#
#   f = 2 dp / (rho Umax^2 N)        (Eq. 16), Umax = Q / A_min    (Eq. 9)
#   Re = Umax D / nu                 (Eq. 8)
#
# dp is the static difference from a half pitch upstream of row 1 to a half
# pitch downstream of the last row. This f is 4x Metzger's per-row
# dp / (2 rho Vmax^2 N), which is pin_fin_correlation.h's canonical basis.
#
# DIGITISATION (2026-10-06, automated, page image at 400 dpi):
#   * axes calibrated on every tick: 20 x-ticks (Re x 1e-4, 0.6 to 2.5) and
#     19 y-ticks (0.00 to 0.36); worst residual 0.0033 in Re x 1e-4 (0.16% of
#     span) and 0.0014 in f (0.36% of span). The 0.40 tick, not used in the
#     fit, reads 0.4009.
#   * marker centres from the outline extents in a 25 px window, ignoring rows
#     a curve line crosses; checked by overlay, every centre on its marker.
#   * all markers are cleanly separated; none overplotted.
#   * cross-checked against an independent (Gemini) read: within 0.001 in f on
#     every common marker. Its extra points were probed on the pixels and are
#     blank paper (Re 0.72/0.92/0.95e4, an x offset), a line dash (1.82e4), or
#     other series' markers (2.22e4 diamond, 2.26e4 triangle).
#
# WHY UNSCORED. These points are what chyu_1990_friction() was FITTED to
# (provenance Fitted), so scoring that set here would measure its fit, not
# its fidelity. The staggered straight series is a cross-source check on
# metzger_1982_staggered_friction -- it sits 16-25% below Metzger at the same
# geometry -- and is for the pin-fin runner (#335 PR C) to score.

paper:
  name: chyu1990
  citation: >-
    Chyu, M.K. (1990). "Heat Transfer and Pressure Drop for Short Pin-Fin
    Arrays With Pin-Endwall Fillet." ASME Journal of Heat Transfer 112,
    926-932.

