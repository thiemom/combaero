    figure: "6"
    panel: single
    geometry:
      arrangement: inline
      pin: straight
      H_D: 1.0
      S_D: 2.5
      X_D: 2.5
      N_rows: 7
    x_axis: Re_D_vmax
    x_scale: 1.0e4  # axis printed as Re x 10^-4
    y_axis: f_pin_per_row_half_head
    kind: measured
    extraction: figure-digitised
    confidence: point
    uncertainty: null
    cross_check: >-
      f = 2 dp / (rho Umax^2 N), Chyu Eq. 16: 4x the canonical per-row
