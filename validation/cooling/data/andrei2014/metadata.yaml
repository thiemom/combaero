    geometry:
      d_mm: 1.5
      angle_deg: 30.0
      L_over_d: 6.25
      sx_over_d: 9.15
      sz_over_d: 7.37
      rows: 18
      row1_x_over_sx: 0.685
    alpha_deg: 30.0
    x_axis: x_over_sx
    x_scale: 1.0
    y_axis: eta_adiabatic
    kind: measured
    extraction: pdf-vector-exact
    confidence: exact
    uncertainty: null
    cross_check: >-
      Extracted from the PDF vector stream, not pixel-digitised. The same
      curve appears as Figure 5 left panel (BR = 1) red, plotted in a
      different panel with an independent calibration: the two agree to RMS
      3.8e-4 in eta over 400 common abscissae, worst point 1.5e-3. Sawtooth
      period 1.0005 against the exact 1.0 expected for one tooth per hole
      row. Monotonically non-decreasing in the row means.
      `uncertainty` is deliberately null -- the EXPERIMENTAL uncertainty of
      the PSP measurement is not stated per-point in the paper, and the
      extraction error measured above (1e-3) is an extraction bound, not a
      measurement band. Writing the extraction error into `uncertainty`
      would be the circularity #389 names.
    class_confidence: confirmed
    scores: baldauf_2002_sellers
