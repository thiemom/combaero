      y_axis_type: linear
      x_ticks: [5, 6, 7, 8, 9, 10]
      x_multiplier: 1.0
      y_ticks: [1.5, 2, 3, 4]
      y_limits: [null, 4.2]
      printed_curve: null
      monotonic: decreasing
      expected_points: 4
      plot_x_limits: [4.6, 10.1]
      plot_y_limits: [1.4, 4.2]

