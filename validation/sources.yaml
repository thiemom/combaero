- file: docs/ejector/art_10.1007_s40430-025-05536-7.pdf
  citation: Akbarnejad, S., Ziabasharhagh, M. (2025). A novel 1D model for the analysis of double-choked
    ejectors validated by CFD simulations. J. Braz. Soc. Mech. Sci. Eng. 47, 253.
  id: DOI 10.1007/s40430-025-05536-7
  topic: [ejector]
  content: Steam ejector; CFD shows traditional 1-D momentum balance and over-expansion assumptions are
    inaccurate; proposes a 1-D model for double-choked operation that drops the momentum equation and
    imposes sonic flow in the constant-area section. Critical back pressure 93 kPa predicted vs 88 kPa
    CFD.
  status: screened
  verdict: 'Evaluated as a P_c* mixing closure and not adopted: 32-60% error on Huang''s rows, worse than
    Huang''s own chain. Useful only as CFD confirmation that a naive mixing-region momentum balance is
    unreliable.'
