- file: docs/orifices/thole_gritsch_schulz_wittig_1997_JFE_119_533_entrance_crossflow.pdf
  citation: 'Thole, K. A., Gritsch, M., Schulz, A., Wittig, S. (1997). Effect of a crossflow at the entrance to a
    film-cooling hole. ASME J. Fluids Engineering 119, 533-540.'
  id: J. Fluids Eng. 119 (Sept. 1997)
  topic: [orifice, film]
  content: 'Mostly LDV flowfield (inside the hole at x/D -0.75, entrance, exit, exit crossflow; Figs. 5-12) of
    ONE round sharp-edged hole, D 10 mm, 30 deg, L/D 6, fed from a COFLOWING supply channel, Ma_c 0-0.59; exit
    crossflow Ma_inf 0 (Fig. 4) or 0.25 (Table 2); VR = DR = 1; Re_D 5.2e4 exit. Cd (actual / ideal flow,
    referenced to the supply TOTAL pressure over the exit static, Pt_c / p_inf, p. 536): Fig. 4, four PR curves
    (1.11-1.63), ~10-12 plotted points each -- Cd 0.73-0.77 at Ma_c 0 rising to 0.85-0.86 (peak Ma_c 0.18-0.3),
    then collapsing (0.65 at Ma_c 0.36, PR 1.11) as the supply static approaches p_inf; Table 2, three points
    (0.72, 0.72, 0.47 at Ma_c 0, 0.3, 0.5). +/-4%. No correlation. Entrance separation moves from leeward to
    windward as Ma_c rises (Fig. 13).'
  status: screened
  verdict: 'Screened 2026-10-28 (#800, #807, #813). Settles #813''s reference-pressure question: Cd is referenced
    to the supply TOTAL pressure, so the supply crossflow''s dynamic head is already in the jet''s drive; a jet
    also given the supply''s axial velocity as separate momentum (#813 PR 2) must book that head once, not twice.
    Confirms Hay, Lampard & Benmansour (1983) as the foundational entrance-crossflow Cd study (wanted). One
    geometry: nothing for #807''s L/D question. Usable as cross-source data for a coflow inlet-crossflow Cd
    (digitise Fig. 4, ~45 points, + Table 2); McGreehan-Schotsch covers normal holes.'
  read_for: ['#813 Cd reference pressure for duct-fed holes', '#800/#807 inlet-crossflow Cd data']
  issues: [800, 807, 813]
  records: []
  notes: Arrived 2026-10-28 as docs/new/Effect_of_a_Crossflow_at_the_Entrance_to_a_Film-Co.pdf. Cites Gritsch,
    Schulz & Wittig 1997 ASME 97-GT-165 (expanded exits, wanted) and Leylek & Zerkle 1994 (entrance separation).
