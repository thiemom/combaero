    the high-crossflow tests far better (B(5,4,2) 1.01: 0.311 -> 0.079). A constant-Cd network is therefore
    like for like with D.1 only below the break points; P/P0 is the measured quantity. Table D.1 prints P/P0 to two decimals: P/P0 fidelity is floored at +/-0.005. Measurement
    uncertainty (Appendix B, Section 4.4.1): Gj/Gj_mean about +/-2%, Gc/Gj +/-2 to 4%.'
